<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="auth-screen" class="container-fluid">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-4">
                <div class="card shadow-lg">
                    <div class="card-header bg-primary text-white text-center">
                        <h4><i class="bi bi-chat-dots-fill me-2"></i>WebSocket Chat</h4>
                    </div>
                    <div class="card-body p-4">
                        <div id="auth-form">
                            <h5 class="text-center mb-4">Вход в чат</h5>
                            <div class="mb-3">
                                <label for="username" class="form-label">Имя пользователя</label>
                                <input type="text" class="form-control" id="username" placeholder="Введите имя" minlength="3" maxlength="32">
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" placeholder="user@example.com">
                            </div>
                            <button type="button" class="btn btn-primary w-100" id="login-btn">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Войти
                            </button>
                            <div id="auth-error" class="alert alert-danger mt-3 d-none"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="chat-screen" class="d-none">
        <div class="container-fluid h-100">
            <div class="row h-100">
                <div class="col-md-3 col-lg-2 bg-dark text-white sidebar">
                    <div class="p-3">
                        <div class="d-flex align-items-center mb-4">
                            <div class="avatar me-3" id="current-user-avatar">
                                <i class="bi bi-person-circle fs-2"></i>
                            </div>
                            <div>
                                <div class="fw-bold" id="current-username">Пользователь</div>
                                <small id="ws-status"><i class="bi bi-circle-fill me-1 text-danger" style="font-size: 8px;"></i>Отключено</small>
                            </div>
                        </div>
                        
                        <button class="btn btn-outline-light w-100 mb-3" data-bs-toggle="modal" data-bs-target="#newChatModal">
                            <i class="bi bi-plus-circle me-2"></i>Новый чат
                        </button>

                        <h6 class="text-uppercase text-muted mb-3 small">Чаты</h6>
                        <div id="chats-list" class="chats-container">
                        </div>
                    </div>
                </div>

                <div class="col-md-9 col-lg-10 chat-area">
                    <div id="no-chat-selected" class="d-flex justify-content-center align-items-center h-100">
                        <div class="text-center text-muted">
                            <i class="bi bi-chat-square-text display-1"></i>
                            <h4 class="mt-3">Выберите чат для общения</h4>
                            <p>Или создайте новый чат</p>
                        </div>
                    </div>

                    <div id="chat-container" class="d-none h-100 d-flex flex-column">
                        <div class="chat-header p-3 border-bottom bg-white">
                            <div class="d-flex align-items-center justify-content-between">
                                <div class="d-flex align-items-center">
                                    <div class="chat-avatar me-3">
                                        <i class="bi bi-people-fill fs-4"></i>
                                    </div>
                                    <div>
                                        <h5 class="mb-0" id="chat-title">Название чата</h5>
                                        <small class="text-muted" id="chat-participants-count">Участники</small>
                                    </div>
                                </div>
                                <button class="btn btn-outline-primary btn-sm" data-bs-toggle="modal" data-bs-target="#participantsModal">
                                    <i class="bi bi-people-fill me-1"></i>Участники
                                </button>
                            </div>
                        </div>

                        <div class="messages-container flex-grow-1 p-3" id="messages">
                        </div>

                        <div class="message-input-area p-3 border-top bg-white">
                            <form id="message-form" class="d-flex gap-2">
                                <textarea class="form-control" id="message-input" placeholder="Введите сообщение..." rows="1" style="resize: none;"></textarea>
                                <button type="submit" class="btn btn-primary align-self-end" style="height: 38px;">
                                    <i class="bi bi-send-fill"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="newChatModal" tabindex="-1" aria-labelledby="newChatModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="newChatModalLabel">Создать новый чат</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="chat-name" class="form-label">Название чата</label>
                        <input type="text" class="form-control" id="chat-name" placeholder="Введите название">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-primary" id="create-chat-btn">Создать</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="participantsModal" tabindex="-1" aria-labelledby="participantsModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="participantsModalLabel">Участники чата</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                </div>
                <div class="modal-body">
                    <ul id="participants-list" class="list-group mb-3">
                    </ul>
                    
                    <hr>
                    <h6>Добавить участника</h6>
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" id="add-participant-input" placeholder="Email или имя пользователя">
                        <button class="btn btn-primary" type="button" id="add-participant-btn">Добавить</button>
                    </div>
                    
                    <h6 class="mt-3">Все пользователи</h6>
                    <div id="all-users-list" class="list-group" style="max-height: 200px; overflow-y: auto;">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="notification-toast" class="toast" role="alert">
            <div class="toast-header">
                <i class="bi bi-bell me-2"></i>
                <strong class="me-auto" id="toast-title">Уведомление</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toast-message"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/chat.js"></script>
</body>
</html>
